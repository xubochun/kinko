<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>myWallet — 資產總覽</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="hero-glow min-h-screen relative z-10">
      <div class="mx-auto max-w-[1024px] px-4 pb-28 pt-10 sm:px-6 sm:pt-12 md:pb-14">
        
        <header class="mb-10 flex items-center justify-between">
          <div class="flex items-center gap-8">
            <div class="flex items-center gap-3">
              <div class="grid h-10 w-10 shrink-0 place-items-center rounded-2xl bg-white/70 ring-1 ring-black/[.06]">
                <i data-lucide="wallet" class="h-5 w-5 text-slate-800"></i>
              </div>
              <div class="leading-tight">
                <div class="text-[12px] font-medium text-gray-500">Portfolio</div>
                <div class="text-[14px] font-semibold text-gray-900">Home</div>
              </div>
            </div>
            
            <nav class="hidden md:flex items-center gap-1">
              <a href="#" class="px-3 py-2 rounded-lg bg-slate-900/5 text-[13px] font-semibold text-slate-900">首頁</a>
              <a href="#" class="px-3 py-2 rounded-lg text-[13px] font-medium text-gray-500 hover:text-slate-900 hover:bg-slate-900/5 transition">存股</a>
              <a href="#" class="px-3 py-2 rounded-lg text-[13px] font-medium text-gray-500 hover:text-slate-900 hover:bg-slate-900/5 transition">探索</a>
            </nav>
          </div>

          <div class="flex items-center gap-2">
            <!-- 次要操作：清空和隱私 -->
            <div class="flex items-center gap-1.5">
              <button
                id="clearDataBtn"
                onclick="toggleClearData()"
                aria-label="清空資料"
                class="hidden items-center justify-center rounded-full bg-white/70 min-w-[44px] min-h-[44px] text-gray-600 ring-1 ring-black/[.06] transition-all hover:bg-white hover:ring-red-200 hover:text-red-600 active:scale-[0.97]">
                <i data-lucide="archive" class="h-[18px] w-[18px]"></i>
              </button>

              <button
                id="privacyBtn"
                aria-label="隱私模式"
                aria-pressed="false"
                title="隱藏金額"
                class="inline-flex items-center justify-center rounded-full bg-white/70 min-w-[44px] min-h-[44px] text-gray-600 ring-1 ring-black/[.06] transition-all hover:bg-white hover:ring-slate-300 active:scale-[0.97]">
                <i data-lucide="eye-off" class="h-[18px] w-[18px]"></i>
              </button>
            </div>
          </div>
        </header>

        <div class="grid grid-cols-1 gap-8 lg:grid-cols-12 lg:gap-10">
          
          <div class="flex flex-col gap-8 lg:col-span-5 lg:-ml-2">
            <section class="text-center lg:text-left">
              <div class="mb-2 text-[12px] font-semibold tracking-[0.2em] text-gray-500 flex items-center justify-center lg:justify-start gap-1.5">
                總資產淨值
              </div>
              <div id="totalValue" class="tabular-nums flex items-center justify-center lg:justify-start text-4xl sm:text-5xl lg:text-[44px] font-semibold leading-tight tracking-[-0.02em] text-gray-900 break-words transition-all duration-300 min-h-[1.2em]">
                NT$ 0
              </div>
              <div class="mt-3 flex flex-col items-center gap-2 text-[13px] font-semibold sm:flex-row lg:justify-start lg:flex-wrap">
                <span class="text-gray-500 font-medium">現價更新於 <span id="updatedAt" class="tabular-nums">09:32</span></span>
              </div>
            </section>

            <div id="emptyStateWelcome" class="hidden soft-card p-6">
              <div class="flex flex-col gap-4">
                <div class="flex flex-wrap items-center gap-2 text-[12px] text-gray-500">
                  <span>新增任何資產後，總資產會立即顯示</span>
                </div>
                <div class="text-[18px] font-semibold text-gray-900">先新增一筆資產，立刻看到總資產與走勢圖</div>
                <div class="grid gap-2 sm:grid-cols-3 text-[12px] text-gray-600">
                  <div class="step-chip">
                    <span class="step-dot">1</span>新增現金或股票
                  </div>
                  <div class="step-chip">
                    <span class="step-dot">2</span>自動抓取現價
                  </div>
                  <div class="step-chip">
                    <span class="step-dot">3</span>生成淨值走勢
                  </div>
                </div>
                <div class="flex flex-col gap-2 sm:flex-row">
                  <button onclick="toggleAddModal()" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 rounded-xl bg-[#2563EB] px-5 py-3 text-[14px] font-semibold text-white shadow-sm transition hover:bg-[#1d4ed8] active:scale-[0.98]">
                    <i data-lucide="plus" class="h-5 w-5"></i>
                    新增第一筆資產
                  </button>
                  <button onclick="loadDemoData()" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 rounded-xl bg-slate-100 px-5 py-3 text-[13px] font-semibold text-gray-700 transition hover:bg-slate-200 active:scale-[0.98]">
                    <i data-lucide="sparkles" class="h-4 w-4"></i>
                    載入示範資料
                  </button>
                </div>
              </div>
            </div>

            <section>
              <div class="mb-3 flex items-center justify-between"></div>

              <div id="assetStructureContent" class="flex flex-col gap-3 sm:gap-4">
                <div class="soft-card p-4 sm:p-5">
                  <div class="mb-5">
                    <div class="flex h-2 w-full overflow-hidden rounded-full bg-slate-100">
                      <div id="cashBar" class="bg-slate-800 transition-all duration-500" style="width: 0%" title="現金"></div>
                      <div id="stockBar" class="bg-[#2563EB] transition-all duration-500" style="width: 0%" title="股票"></div>
                    </div>
                    <div class="mt-2 flex justify-between text-[11px] font-medium text-gray-500">
                      <span>現金 <span id="cashPct" class="font-semibold text-slate-800">--%</span></span>
                      <span>股票現值 <span id="stockPct" class="font-semibold text-[#2563EB]">--%</span></span>
                    </div>
                  </div>

                  <button onclick="openDetail('cash')" class="w-full group mb-3 flex items-center justify-between gap-4 border-b border-gray-100 pb-3 min-h-[32px] transition-opacity hover:opacity-70">
                    <div class="flex flex-1 min-w-0 items-center gap-2">
                      <div class="grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-slate-800">
                        <i data-lucide="banknote" class="h-4 w-4 text-white"></i>
                      </div>
                      <div class="text-[13px] font-semibold text-gray-500 truncate text-left">
                        現金 <span id="cashCount" class="text-[11px] font-normal text-gray-400 ml-1">0 個帳戶</span>
                      </div>
                    </div>
                    <div class="flex items-center gap-1">
                      <div id="cashValue" class="tabular-nums shrink-0 text-right text-[16px] font-semibold text-gray-900 transition-all duration-300">
                        NT$ 0
                      </div>
                      <i data-lucide="chevron-right" class="h-4 w-4 text-gray-300 transition-transform group-hover:translate-x-0.5"></i>
                    </div>
                  </button>

                  <button onclick="openDetail('stock')" class="w-full group flex items-center justify-between gap-4 min-h-[32px] transition-opacity hover:opacity-70">
                    <div class="flex flex-1 min-w-0 items-center gap-2">
                      <div class="grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-[#2563EB]">
                        <i data-lucide="candlestick-chart" class="h-4 w-4 text-white"></i>
                      </div>
                      <div class="text-[13px] font-semibold text-gray-500 truncate text-left">
                        股票 <span id="stockCount" class="text-[11px] font-normal text-gray-400 ml-1">0 檔標的</span>
                      </div>
                    </div>
                    <div class="flex items-center gap-1">
                      <div id="stockValue" class="tabular-nums shrink-0 text-right text-[16px] font-semibold text-gray-900 transition-all duration-300">
                        NT$ 0
                      </div>
                      <i data-lucide="chevron-right" class="h-4 w-4 text-gray-300 transition-transform group-hover:translate-x-0.5"></i>
                    </div>
                  </button>
                </div>

                <div id="emptyStateStructure" class="hidden soft-card p-5 text-center">
                  <div class="inline-grid h-12 w-12 place-items-center rounded-xl bg-slate-50 ring-1 ring-black/[.04] mb-3">
                    <i data-lucide="pie-chart" class="h-6 w-6 text-gray-300"></i>
                  </div>
                  <div class="text-[14px] font-semibold text-gray-900 mb-1">資產配置概覽</div>
                  <div class="text-[12px] text-gray-500 leading-relaxed">
                    新增資產後，這裡將顯示您的現金與股票配置比例
                  </div>
                </div>
              </div>
            </section>
          </div>

          <div class="lg:col-span-7 min-w-0">
            <section class="h-full">
              <div class="soft-card p-5 sm:p-6 h-full flex flex-col min-w-0">
                <!-- 有資料時顯示的圖表控制和內容 -->
                <div id="chartWithData" class="flex flex-col h-full">
                  <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between mb-2">
                    <div class="seg inline-flex gap-1 self-start sm:self-auto" role="group">
                      <button id="btn1m" data-range="1m" aria-pressed="false">1個月</button>
                      <button id="btn3m" data-range="3m" aria-pressed="true">3個月</button>
                      <button id="btn1y" data-range="1y" aria-pressed="false">1年</button>
                      <button id="btnAll" data-range="all" aria-pressed="false">全部</button>
                    </div>
                  </div>
                  <div class="mt-4 chart-wrap flex-grow w-full relative">
                    <canvas id="mainChart" aria-label="資產走勢圖" role="img"></canvas>
                  </div>
                  <div class="mt-4 flex items-center justify-between pt-4 border-t border-gray-100 min-h-[36px]">
                    <div class="text-[12px] font-medium text-gray-500 truncate mr-2">
                      <i data-lucide="info" class="inline h-3 w-3 mr-1 mb-0.5"></i>系統每天自動紀錄一個淨值點
                    </div>
                    <div id="selectedPoint" class="tabular-nums shrink-0 text-[13px] font-semibold text-gray-900 transition-all duration-300">—</div>
                  </div>
                </div>

                <!-- 無資料時顯示的空狀態 -->
                <div id="emptyStateChart" class="hidden flex-col items-center justify-center text-center h-full py-12">
                  <div class="grid h-20 w-20 place-items-center rounded-2xl bg-gradient-to-br from-slate-50 to-slate-100/50 ring-1 ring-black/[.04] mb-5">
                    <i data-lucide="line-chart" class="h-10 w-10 text-gray-300"></i>
                  </div>
                  <div class="text-[16px] font-semibold text-gray-900 mb-2">資產走勢圖</div>
                  <div class="text-[13px] text-gray-500 leading-relaxed max-w-[320px] mb-6">
                    新增資產後，這裡將以視覺化圖表呈現您的淨值變化趨勢
                  </div>
                  <div class="flex flex-wrap items-center justify-center gap-4 text-[12px] text-gray-400">
                    <div class="flex items-center gap-1.5">
                      <i data-lucide="trending-up" class="h-3.5 w-3.5"></i>
                      <span>追蹤淨值變化</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                      <i data-lucide="calendar" class="h-3.5 w-3.5"></i>
                      <span>每日自動記錄</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                      <i data-lucide="bar-chart-3" class="h-3.5 w-3.5"></i>
                      <span>多種時間範圍</span>
                    </div>
                  </div>
                </div>
              </div>
            </section>
          </div>

        </div>
      </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 z-40 flex justify-center pointer-events-none md:hidden sm:bottom-6 sm:px-6">
      <div class="w-full bg-white/90 backdrop-blur-xl border-t border-gray-200/60 pointer-events-auto sm:max-w-md sm:rounded-3xl sm:border sm:shadow-[0_20px_40px_-10px_rgba(17,24,39,0.1)] transition-all">
        <div class="flex justify-around items-center h-[68px] px-2 sm:px-6 pb-safe">
          <button class="group flex flex-col items-center justify-center w-full gap-1 text-[#2563EB] transition-colors">
            <div class="relative grid h-8 w-8 place-items-center rounded-xl bg-[#2563EB]/10">
              <i data-lucide="home" class="h-[22px] w-[22px] fill-[#2563EB]/20"></i>
            </div>
            <span class="text-[10px] font-semibold">首頁</span>
          </button>
          
          <button class="group flex flex-col items-center justify-center w-full gap-1 text-gray-400 hover:text-slate-900 transition-colors">
            <div class="relative grid h-8 w-8 place-items-center rounded-xl transition-colors group-hover:bg-slate-900/5">
              <i data-lucide="pie-chart" class="h-[22px] w-[22px]"></i>
            </div>
            <span class="text-[10px] font-medium">存股</span>
          </button>
          
          <button class="group flex flex-col items-center justify-center w-full gap-1 text-gray-400 hover:text-slate-900 transition-colors">
            <div class="relative grid h-8 w-8 place-items-center rounded-xl transition-colors group-hover:bg-slate-900/5">
              <i data-lucide="compass" class="h-[22px] w-[22px]"></i>
            </div>
            <span class="text-[10px] font-medium">探索</span>
          </button>
          
          <button class="group flex flex-col items-center justify-center w-full gap-1 text-gray-400 hover:text-slate-900 transition-colors">
            <div class="relative grid h-8 w-8 place-items-center rounded-xl transition-colors group-hover:bg-slate-900/5">
              <i data-lucide="user" class="h-[22px] w-[22px]"></i>
            </div>
            <span class="text-[10px] font-medium">我的</span>
          </button>
        </div>
      </div>
    </nav>

    <div id="detailOverlay" class="fixed inset-0 z-50 modal-enter flex items-end md:items-center justify-center">
      <div class="absolute inset-0 bg-slate-900/40" onclick="closeDetail()"></div>
      <div id="detailSheet" class="detail-sheet detail-sheet--fullscreen relative w-full bg-white sheet-enter sm:max-w-lg md:max-w-2xl mx-auto shadow-2xl">
        <div class="detail-header">
          <button onclick="closeDetail()" class="detail-back md:opacity-0 md:pointer-events-none">
            <i data-lucide="chevron-left" class="h-5 w-5"></i>
          </button>
          <div class="detail-title">
            <h3 id="detailTitle" class="text-[18px] font-semibold text-gray-900">明細</h3>
            <div id="detailSubtitle" class="text-[12px] text-gray-500 mt-1">—</div>
          </div>
          <button onclick="closeDetail()" class="detail-close hidden md:inline-flex">
            <i data-lucide="x" class="h-5 w-5"></i>
          </button>
        </div>
        <div class="detail-content">
          <div id="detailSummary" class="detail-summary mb-4"></div>
          <div id="detailBody" class="detail-body"></div>
        </div>
      </div>
    </div>

    <button
      id="floatingAddBtn"
      onclick="toggleAddModal()"
      aria-label="新增資產"
      class="floating-add-btn">
      <i data-lucide="plus" class="h-5 w-5"></i>
      <span class="hidden sm:inline">新增資產</span>
    </button>

    <div id="addModalOverlay" class="fixed inset-0 z-50 modal-enter flex items-end md:items-center justify-center">
      <div class="absolute inset-0 bg-slate-900/40" onclick="toggleAddModal()"></div>
      
      <div id="addModalSheet" class="relative w-full bg-white rounded-t-3xl md:rounded-3xl p-6 pb-10 md:pb-6 sheet-enter sm:max-w-sm md:max-w-md mx-auto shadow-2xl">
        <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-6 md:hidden"></div>
        
        <button onclick="toggleAddModal()" class="hidden md:block absolute top-4 right-4 p-2 text-gray-400 hover:text-gray-600 transition-colors rounded-full hover:bg-gray-100">
          <i data-lucide="x" class="h-5 w-5"></i>
        </button>

        <h3 class="text-[18px] font-semibold text-gray-900 mb-4 text-center md:text-left">新增資產紀錄</h3>
        
        <form id="addAssetForm" onsubmit="handleAddNewAsset(event)" class="flex flex-col gap-4">
          <div>
            <label class="block text-[13px] font-medium text-gray-700 mb-1.5">資產類型</label>
            <select id="assetType" onchange="toggleFormFields()" class="w-full rounded-xl border border-gray-200 bg-gray-50/50 p-3 text-[14px] text-gray-900 outline-none focus:border-[#2563EB] focus:ring-1 focus:ring-[#2563EB] transition-all">
              <option value="cash">銀行帳戶 (現金、活定存)</option>
              <option value="stock">股票與 ETF (投資部位)</option>
            </select>
          </div>
          
          <div id="cashFields" class="flex flex-col gap-4">
            <div>
              <label class="block text-[13px] font-medium text-gray-700 mb-1.5">帳戶名稱</label>
              <input type="text" id="cashName" placeholder="例如：台新 Richart" class="w-full rounded-xl border border-gray-200 bg-gray-50/50 p-3 text-[14px] text-gray-900 outline-none focus:border-[#2563EB] focus:ring-1 focus:ring-[#2563EB] transition-all">
            </div>
            <div>
              <label class="block text-[13px] font-medium text-gray-700 mb-1.5">當前金額 (NT$)</label>
              <input type="number" id="assetAmount" min="0" placeholder="例如：50000" class="w-full rounded-xl border border-gray-200 bg-gray-50/50 p-3 text-[14px] text-gray-900 outline-none focus:border-[#2563EB] focus:ring-1 focus:ring-[#2563EB] transition-all">
            </div>
          </div>

          <div id="stockFields" class="hidden flex-col gap-4">
            <div>
              <label class="block text-[13px] font-medium text-gray-700 mb-1.5">股票代號</label>
              <input type="text" id="stockTicker" placeholder="例如：2330" class="w-full rounded-xl border border-gray-200 bg-gray-50/50 p-3 text-[14px] text-gray-900 outline-none focus:border-[#2563EB] focus:ring-1 focus:ring-[#2563EB] transition-all">
            </div>
            <div>
              <label class="block text-[13px] font-medium text-gray-700 mb-1.5">購買日期</label>
              <input type="date" id="stockDate" class="w-full rounded-xl border border-gray-200 bg-gray-50/50 p-3 text-[14px] text-gray-900 outline-none focus:border-[#2563EB] focus:ring-1 focus:ring-[#2563EB] transition-all">
            </div>
            <div class="flex gap-4">
              <div class="flex-1">
                <label class="block text-[13px] font-medium text-gray-700 mb-1.5">購買股數</label>
                <input type="number" id="stockShares" min="1" step="any" placeholder="例如：1000" class="w-full rounded-xl border border-gray-200 bg-gray-50/50 p-3 text-[14px] text-gray-900 outline-none focus:border-[#2563EB] focus:ring-1 focus:ring-[#2563EB] transition-all">
              </div>
              <div class="flex-1">
                <label class="block text-[13px] font-medium text-gray-700 mb-1.5">購買單價 (NT$)</label>
                <input type="number" id="stockPrice" min="0" step="any" placeholder="例如：850" class="w-full rounded-xl border border-gray-200 bg-gray-50/50 p-3 text-[14px] text-gray-900 outline-none focus:border-[#2563EB] focus:ring-1 focus:ring-[#2563EB] transition-all">
              </div>
            </div>
            <div class="text-[12px] text-gray-500 mt-[-4px]">
              <i data-lucide="info" class="inline h-3 w-3 mr-1 mb-0.5"></i>系統將根據代號自動獲取標的名稱與現價
            </div>
          </div>

          <div class="mt-2 flex flex-col gap-2">
            <button type="submit" class="w-full py-3 rounded-xl bg-[#2563EB] text-[14px] font-semibold text-white hover:bg-[#1d4ed8] transition-colors active:scale-95">
              確認新增
            </button>
            <button type="button" onclick="toggleAddModal()" class="w-full py-3 rounded-xl bg-gray-100 text-[14px] font-semibold text-gray-600 hover:bg-gray-200 transition-colors md:hidden">
              取消
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="api.js"></script>
    <script src="app.js"></script>
  </body>
</html>
